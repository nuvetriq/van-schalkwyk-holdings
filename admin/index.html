<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Van Schalkwyk Holdings Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><main class="shell"><section id="loginView" class="card login-card"><div class="brand-mark">VS</div><p class="eyebrow">Van Schalkwyk Holdings</p><h1>Admin login</h1><p class="muted">Sign in to manage products for Granny’s Little Bakery and Clever Cubs Learning.</p><form id="loginForm" class="stack"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button><p id="loginMessage" class="message" aria-live="polite"></p></form><a class="back-link" href="/">← Back to Van Schalkwyk Holdings</a></section><section id="adminView" class="hidden"><header class="admin-header"><div><p class="eyebrow">Van Schalkwyk Holdings</p><h1>Product Admin</h1></div><div class="header-actions"><a href="/" target="_blank" rel="noreferrer">View website</a><button id="logoutBtn" class="secondary">Log out</button></div></header><div class="business-switch" role="tablist"><button data-business="bakery" class="active">Granny’s Little Bakery</button><button data-business="clever-cubs">Clever Cubs Learning</button></div><div class="admin-grid"><section class="card editor-card"><div class="section-title"><div><p class="eyebrow">Product details</p><h2 id="formTitle">Add product</h2></div><button id="newBtn" class="secondary small" type="button">New</button></div><form id="productForm" class="stack" enctype="multipart/form-data"><input type="hidden" name="id" id="productId"><input type="hidden" name="business" id="businessInput" value="bakery"><label>Product name<input name="name" id="nameInput" maxlength="120" required></label><label>Category<input name="category" id="categoryInput" maxlength="80" list="categorySuggestions" required></label><datalist id="categorySuggestions"></datalist><label>Description<textarea name="description" id="descriptionInput" maxlength="1500" rows="5"></textarea></label><div class="two-col"><label>Price (R)<input name="price" id="priceInput" inputmode="decimal" placeholder="e.g. 150.00"></label><label>Sort order<input name="sort_order" id="sortInput" type="number" value="0"></label></div><label class="check"><input name="active" id="activeInput" type="checkbox" checked><span>Visible on public website</span></label><label>Product image<input name="image" id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><div id="currentImageWrap" class="image-preview hidden"><img id="currentImage" alt="Current product image"><label class="check"><input type="checkbox" id="removeImage"><span>Remove current image</span></label></div><button type="submit" id="saveBtn">Save product</button><p id="formMessage" class="message" aria-live="polite"></p></form></section><section class="card list-card"><div class="section-title"><div><p class="eyebrow">Catalogue</p><h2>Products</h2></div><span id="productCount" class="count">0</span></div><div id="productList" class="product-list"></div></section></div></section></main><script src="/admin/admin.js" defer></script></body></html>
